<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmers Forward · Know your soil before you fertilize</title>
    <meta name="description" content="Free soil health assessment for small farms. Map your field, enter soil sensor readings, and get a Texas A&amp;M-backed fertilizer plan and PDF report. No sign-up." />
    <meta name="theme-color" content="#05070D" />
    <meta property="og:title" content="Farmers Forward" />
    <meta property="og:description" content="Map your field, enter soil readings, get a Texas A&amp;M-backed plan. Free, no sign-up." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The tool's satellite tiles (its largest paint). -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <!-- Fonts load without blocking the first paint (display=swap shows system text first). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" /></noscript>
    <script>
      // Fetch each page's first big image early: the landing hero's poster,
      // or the tool's background texture.
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/avif'
        l.setAttribute('imagesrcset', '/media/hero-poster-960.avif 960w, /media/hero-poster-1600.avif 1600w, /media/hero-poster-2400.avif 2400w')
        l.setAttribute('imagesizes', '100vw')
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      } else if (location.pathname === '/tool') {
        // The tool's faint soil texture is its first big paint.
        var t = document.createElement('link')
        t.rel = 'preload'
        t.as = 'image'
        t.type = 'image/avif'
        t.href = '/media/texture-1600.avif'
        document.head.appendChild(t)
      }
    </script>
  </head>
  <body>
    <noscript>Farmers Forward needs JavaScript to map your field.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
