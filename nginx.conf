# =============================================================================
# Farmers Forward - Nginx site configuration
# =============================================================================
# Serves the built React SPA and reverse-proxies the API to the gunicorn
# backend (managed by farmersforward.service, listening on 127.0.0.1:8000).
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/farmersforward
#   sudo ln -s /etc/nginx/sites-available/farmersforward /etc/nginx/sites-enabled/farmersforward
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are obtained with Certbot (Let's Encrypt). Run this AFTER the
# port-80 server below is live so the ACME HTTP-01 challenge can be answered:
#   sudo certbot --nginx -d farmersforward.org -d www.farmersforward.org
# Certbot will fill in / manage the certificate paths referenced in the :443
# server block. Renewal is automatic via the certbot systemd timer.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP :80 - serve the ACME challenge, redirect everything else to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name farmersforward.org www.farmersforward.org;

    # Let's Encrypt / Certbot HTTP-01 challenge. Certbot writes tokens here and
    # they must be reachable over plain HTTP, so serve them before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # All other HTTP traffic is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 - the actual site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name farmersforward.org www.farmersforward.org;

    # --- TLS (Let's Encrypt) -------------------------------------------------
    # These paths are created/managed by Certbot (see the certbot command above).
    ssl_certificate     /etc/letsencrypt/live/farmersforward.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmersforward.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/farmersforward.org/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Uploads / request size ---------------------------------------------
    client_max_body_size 10m;

    # --- Static React build (SPA) -------------------------------------------
    root /var/www/farmersforward/frontend/dist;
    index index.html;

    # gzip for text assets.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API reverse proxy to gunicorn --------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # --- SPA fallback: every other path returns the React entry point --------
    location / {
        try_files $uri /index.html;
    }
}
